[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-profiler"
dynamic = ["version"]
description = "Runtime Conditions Python profiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "packaging>=24.0",
  "PyYAML>=6.0",
  "referencing>=0.28.4",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
runtimeconditions-python-profiler = "runtimeconditions_profiler.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["runtimeconditions_profiler*"]
namespaces = false

[tool.setuptools.package-data]
runtimeconditions_profiler = ["schemas.json", "runtimeconditions.profile.v0.4.0.schema.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
