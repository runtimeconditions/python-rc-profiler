[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeconditions-profiler"
version = "0.1.0"
description = "Runtime Conditions Python profiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "packaging>=24.0",
  "PyYAML>=6.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
runtimeconditions-python-profiler = "runtimeconditions_profiler.cli:main"

[tool.setuptools.packages.find]
include = ["runtimeconditions_profiler*"]

[tool.setuptools.package-data]
runtimeconditions_profiler = ["schemas.json", "runtimeconditions.profile.v0.2.0.schema.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
