apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  uri: https://example.com/python-fixtures/transitive-config
  version: v1alpha1
spec:
  dependencies:
    - https://example.com/python-fixtures/transitive-base:v1alpha1
  conditionFields:
    - name: configuration
      appliesToKinds:
        - app.fixture
      appliesToInterfaceTypes:
        - app
  fieldValues:
    - field: configuration.env[].property
      targetKind: app.fixture
      targetType: app
      values:
        - url

